name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install native Kafka build dependencies
        run: sudo apt-get update && sudo apt-get install --yes cmake libcurl4-openssl-dev libsasl2-dev pkg-config
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all --check
      - name: Evidence verifier unit tests (no timing gate)
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Phase 25 portable filter correctness and capability refusal
        run: cargo test --locked -p ade-exec --features filter-kernels-v1 filter_kernel
      - name: Phase 25 feature-on external API compatibility
        run: cargo test --manifest-path examples/phase25-external-consumer/Cargo.toml --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Build feature-matched native worker for process tests
        run: cargo build --workspace --all-features --locked
      - name: Phase 25 portable native process and refusal smoke
        run: bash scripts/phase25/portable-smoke.sh target/debug/ade-bench
      - name: Test
        run: cargo test --workspace --all-features --locked
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Phase 24 standalone extension consumer
        run: cargo test --locked --manifest-path examples/phase24-external-consumer/Cargo.toml
      - name: Phase 24 native process correctness and detached verification
        run: |
          python -m pip install -r scripts/phase24/requirements.txt
          cargo build --locked -p ade-ext-graph --features fault-injection --example phase24-native
          output="$RUNNER_TEMP/ade24-native"
          seal="$(python scripts/phase24/campaign.py --binary target/debug/examples/phase24-native --output "$output" --no-benchmarks)"
          python scripts/phase24/verify.py "$output" --mode historical-archive --seal-pin "$seal"
          python scripts/phase24/tamper.py "$output" --seal-pin "$seal"
      - name: Phase 26 native cross-job cache correctness
        run: |
          python -m pip install -r scripts/phase26/requirements.txt
          cargo build --locked -p ade-cache --features fault-injection --bin ade-cache
          output="$RUNNER_TEMP/ade26-native"
          python scripts/phase26/campaign.py target/debug/ade-cache "$output" --no-economics
          pin="$(python scripts/phase26/verify.py "$output" --seal)"
          python scripts/phase26/verify.py "$output" --pin "$pin"
      - name: Phase 26 frozen archive replay
        run: |
          git fetch --no-tags --depth=2 origin 9134b4745c33029e27421b4d0a4c57c604c50ef2
          bash scripts/phase26/historical.sh
      - name: Build CLI
        run: cargo build --workspace --locked
      - name: Benchmark correctness smoke (no timing gate)
        run: bash scripts/smoke.sh
      - name: Criterion smoke
        run: cargo bench --locked -p ade-bench --bench smoke -- --test

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check declared MSRV
        run: cargo check --workspace --all-targets --locked

  phase22-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: clients/java/pom.xml
      - name: Build gateway and language clients
        run: |
          cargo build --locked -p ade-gateway --features flight-sql-v1 --bin ade-gateway --example phase22-native
          python -m pip install ./clients/python blake3==1.0.8
          mvn -B -f clients/java/pom.xml compile dependency:build-classpath -Dmdep.outputFile=target/classpath.txt
      - name: Live Flight SQL, native plan and registered function
        run: |
          PYTHONDONTWRITEBYTECODE=1 python scripts/phase22/campaign.py \
            --binary target/debug/ade-gateway --native target/debug/examples/phase22-native \
            --java "$(command -v java)" --java-classpath "$(cat clients/java/target/classpath.txt)" \
            --interop-only --output "$RUNNER_TEMP/ade-phase22-smoke"
      - name: Detached verification and fully rehashed tamper checks
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s clients/python/tests
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s scripts/phase22 -p test_verify.py
          mkdir -p "$RUNNER_TEMP/ade-phase22-evidence"
          tar -xzf docs/evidence/phase22/candidate-final.tar.gz -C "$RUNNER_TEMP/ade-phase22-evidence"
          phase22_pin="$(cat docs/evidence/phase22/candidate-final.seal-sha256)"
          PYTHONDONTWRITEBYTECODE=1 python scripts/phase22/verify.py --mode historical-archive \
            --receipt-pin "$phase22_pin" "$RUNNER_TEMP/ade-phase22-evidence"
          PYTHONDONTWRITEBYTECODE=1 python scripts/phase22/tamper.py \
            --receipt-pin "$phase22_pin" "$RUNNER_TEMP/ade-phase22-evidence"

  phase23-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the manager and matched worker
        run: |
          cargo build --locked -p ade-resource -p ade-ops -p ade-distributed --features ade-resource/fault-injection --bins --example phase23-fixture
      - name: Authenticated socket, separate native cohorts and preemption
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/phase23/campaign.py --bin-dir target/debug \
            --output "$RUNNER_TEMP/ade-phase23-smoke" --only auth --only overlap --only preemption \
            --only commit_race --only crash_aggregate_gather --only crash_join_marker_published
