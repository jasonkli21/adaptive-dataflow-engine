[workspace]
members = [
    "crates/ade-bench",
    "crates/ade-exec",
    "crates/ade-distributed",
]
resolver = "3"

[workspace.dependencies]
arrow = { version = "59.3.1", default-features = false }
parquet = { version = "59.3.1", default-features = false, features = ["arrow", "snap", "zstd"] }

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.94"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
