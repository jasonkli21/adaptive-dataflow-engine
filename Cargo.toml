[workspace]
members = [
    "crates/ade-bench",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.94"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
