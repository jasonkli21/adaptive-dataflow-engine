[package]
name = "ade-frontend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
[lints]
workspace = true
[features]
default = []
unified-planner = ["dep:ade-logical"]

[dependencies]
ade-logical = { path = "../ade-logical", optional = true }
ade-physical = { path = "../ade-physical" }
ade-exec = { path = "../ade-exec" }
ade-distributed = { path = "../ade-distributed" }
arrow.workspace = true
datafusion = { version = "=55.2.0", default-features = false, features = ["sql", "parquet"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
[dev-dependencies]
parquet.workspace = true
ade-bench = { path = "../ade-bench" }
tempfile = "3"
