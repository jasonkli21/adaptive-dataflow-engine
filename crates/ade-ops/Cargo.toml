[package]
name = "ade-ops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
[lints]
workspace = true
[features]
default = []
fault-injection = ["ade-distributed/research-hooks"]
[dependencies]
ade-distributed = { path = "../ade-distributed" }
ade-physical = { path = "../ade-physical" }
ade-exec = { path = "../ade-exec" }
ade-frontend = { path = "../ade-frontend" }
arrow = { workspace = true, features = ["ipc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive"] }
[dev-dependencies]
tempfile = "3"
parquet = { workspace = true }
[[bin]]
name = "ade-batch"
path = "src/main.rs"
