[package]
name = "ade-resource"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
fault-injection = ["ade-ops/fault-injection"]

[dependencies]
ade-ops = { path = "../ade-ops" }
ade-physical = { path = "../ade-physical" }
ade-distributed = { path = "../ade-distributed" }
blake3 = "1"
clap = { version = "4", features = ["derive"] }
getrandom = "0.4"
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
arrow = { workspace = true, features = ["ipc"] }
parquet.workspace = true
ade-exec = { path = "../ade-exec" }
