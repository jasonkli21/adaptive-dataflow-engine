[package]
name = "ade-stream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
unified-planner = ["dep:ade-logical", "kafka"]
stateful = ["kafka"]
transactional-state = ["stateful"]
adaptive-checkpoint = ["stateful"]
remote-checkpoint = ["adaptive-checkpoint", "dep:object_store", "dep:url", "dep:reqwest", "dep:async-trait", "dep:http-body-util", "dep:tokio", "dep:futures"]
kafka = ["dep:rdkafka", "dep:ctrlc", "dep:rustix", "dep:futures-executor"]

[dependencies]
ade-logical = { path = "../ade-logical", optional = true }
object_store = { version = "0.13.2", default-features = false, features = ["aws", "tls-webpki-roots"], optional = true }
url = { version = "2", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "stream"], optional = true }
async-trait = { version = "0.1", optional = true }
http-body-util = { version = "0.1", optional = true }
tokio = { version = "1", features = ["rt", "time"], optional = true }
futures = { version = "0.3", optional = true }
ade-exec = { path = "../ade-exec" }
arrow.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rdkafka = { version = "=0.39.0", default-features = false, features = ["cmake-build", "ssl"], optional = true }
futures-executor = { version = "0.3", optional = true }
ctrlc = { version = "3.5", optional = true }
rustix = { version = "1", features = ["fs"], optional = true }

[[bin]]
name = "ade-stream"
path = "src/bin/ade-stream.rs"
required-features = ["kafka"]

[[bin]]
name = "ade-state-stream"
path = "src/bin/ade-state-stream.rs"
required-features = ["stateful"]

[dev-dependencies]
bytes = "1"

[[bin]]
name = "ade-state-stream-txn"
path = "src/bin/ade-state-stream-txn.rs"
required-features = ["transactional-state"]
